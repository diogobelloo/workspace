<body>
    <h1>Carrousel com HTML e CSS</h1>

    <div class="slider">

            <input type="radio" name="radio-btn" id="radio01">

            </div>
            <div class="slide ">
                <img src="https://files.oaiusercontent.com/file-9u5Vp6VexG8WbbLywzTJ29?se=2025-03-26T16%3A27%3A32Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3Dd8846257-57ff-463f-84e3-2f03fef0405d.webp&sig=JLdM04%2B5HqenAJKzX06jTqJXycJqzACi0ujPTQd32gk%3D" alt="">

            <div class="slide ">
                <img src="https://files.oaiusercontent.com/file-A4S77zR2j1VdZjKfqeZYA2?se=2025-03-26T16%3A27%3A20Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3D3a073f63-8ace-4c60-8c44-edadb1e9ba24.webp&sig=xjt5BHS3la0buTZU28Doc2c9FNIbAJwdPzBs06YG9Bg%3D" alt="">
            </div>
            <div class="slide ">
                <img src="https://files.oaiusercontent.com/file-9u5Vp6VexG8WbbLywzTJ29?se=2025-03-26T16%3A27%3A32Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3Dd8846257-57ff-463f-84e3-2f03fef0405d.webp&sig=JLdM04%2B5HqenAJKzX06jTqJXycJqzACi0ujPTQd32gk%3D" alt="">

                <div class="auto-btn1"></div>
                <div class="auto-btn2"></div>
                <div class="auto-btn3"></div>
                <div class="auto-btn4"></div>
            </div>

            
        </div>
        <div class="manual-navigation">
            <label for="radio01" class="manual-btn"></label>
            <label for="radio02" class="manual-btn"></label>
            <label for="radio03" class="manual-btn"></label>
            <label for="radio04" class="manual-btn"></label>
